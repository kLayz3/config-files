general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 4 minutes
listener {
    timeout = 240
    on-timeout = pidof hyprlock || ~/.local/bin/idle-screensaver
    # on-resume = ~/.local/bin/idle-screensaver-stop
}

# Lock system after 12 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 600
    on-timeout = ~/.local/bin/idle-screensaver-stop; omarchy-system-lock
    on-resume = ~/.local/bin/idle-screensaver-stop; omarchy-system-wake
}
